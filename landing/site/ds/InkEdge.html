<!doctype html><html lang="ru" data-mqx-style="ink"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>InkEdge — Чернильный край</title><link rel="stylesheet" href="./tokens.css"><link rel="stylesheet" href="./bundle.css"><link rel="stylesheet" href="./runtime-ink.css"><link rel="stylesheet" href="./ink-examples.css"><style>body{background:transparent}.th-stage{max-width:none;padding:16px}html{overflow-x:hidden}</style></head><body class="th-ink"><!-- @dsCard group="Стиль подачи" height=560 -->
<div class="th-stage th-ink">
  <section class="th-ink-main" aria-label="Ход 12">
    <div class="th-row"><b class="th-h">Твой ход</b><span class="th-cap">ход 12</span></div>
    <div  class="th-btn th-btn--secondary th-btn--wide th-ink-fill">2 события — открой колоду</div>

  </div>

    <p class="th-close__line" style="text-align:left">Лист — только чернильная линия сверху, крестик — заливка и тень.</p>
  </section>
</div>
