<!doctype html><html lang="ru" data-mqx-style="ink"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EventCard — Чернильный край</title><link rel="stylesheet" href="./tokens.css?v=353420a3f8e1"><link rel="stylesheet" href="./bundle.css?v=21a623bdb2cf"><link rel="stylesheet" href="./runtime-ink.css?v=9cfd1bbae1c5"><link rel="stylesheet" href="./ink-examples.css?v=4740cb3a8a40"><style>body{background:transparent}.th-stage{max-width:none;padding:16px}html{overflow-x:hidden}</style></head><body class="th-ink"><!-- @dsCard group="События" height=400 -->
<div class="th-stage">
  <article class="th-event" role="group" aria-label="Сломался ноутбук">
    <div class="th-event__band"><span class="th-pill">Техника</span><span class="th-pill">1 из 2</span><div  class="th-x" aria-label="Закрыть">×</div></div>
    <div class="th-event__body">
      <h4>Сломался ноутбук</h4>
      <p class="th-muted">Без него не сдать курсовую. Мастер берёт 12 000 ₽, новый стоит 55 000 ₽.</p>
      <div  class="th-choice">Отремонтировать<span class="th-chips"><span class="th-chip">−12 000 ₽</span><span class="th-chip th-chip--gain">↑ Отдых +4</span></span></div>
      <div  class="th-choice">Купить в рассрочку<span class="th-chips"><span class="th-chip th-chip--risk">↓ Долг 55 000 ₽</span><span class="th-chip th-chip--gain">↑ Отдых +8</span></span></div>
    </div>
  </article>
</div>
</body></html>
