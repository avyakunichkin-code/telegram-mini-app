<!-- @dsCard group="События" height=400 -->
<div class="th-stage">
  <article class="th-event" role="dialog" aria-label="Сломался ноутбук">
    <div class="th-event__band"><span class="th-pill">Техника</span><span class="th-pill">1 из 2</span><button class="th-x" aria-label="Закрыть">×</button></div>
    <div class="th-event__body">
      <h4>Сломался ноутбук</h4>
      <p class="th-muted">Без него не сдать курсовую. Мастер берёт 12 000 ₽, новый стоит 55 000 ₽.</p>
      <button class="th-choice" aria-pressed="true">Отремонтировать<span class="th-chips"><span class="th-chip">−12 000 ₽</span><span class="th-chip th-chip--gain">↑ Отдых +4</span></span></button>
      <button class="th-choice" aria-pressed="false">Купить в рассрочку<span class="th-chips"><span class="th-chip th-chip--risk">↓ Долг 55 000 ₽</span><span class="th-chip th-chip--gain">↑ Отдых +8</span></span></button>
    </div>
  </article>
</div>
