<div class="th-stage">
  <section class="th-sheet" role="dialog" aria-modal="true" aria-labelledby="sh1">
    <h3 class="th-sheet__title" id="sh1">Кредиты</h3>
    <button class="th-sheet__close" aria-label="Закрыть">×</button>
    <ul class="th-sheet__list">
      <li class="th-sheet__row"><span><b>Потребительский</b><small><span class="th-money">180 000 ₽</span> · 14% годовых · 24 хода</small></span><button class="th-btn th-btn--secondary">Взять</button></li>
      <li class="th-sheet__row"><span><b>Кредитная карта</b><small>до <span class="th-money">60 000 ₽</span> · 29% годовых</small></span><button class="th-btn th-btn--secondary">Оформить</button></li>
    </ul>
  </section>
  <section class="th-sheet" role="dialog" aria-modal="true" aria-labelledby="sh2">
    <h3 class="th-sheet__title" id="sh2">Продать машину?</h3>
    <p class="th-muted" style="margin:0">Получишь <b class="th-money">520 000 ₽</b>, расходы на обслуживание уйдут со следующего хода.</p>
    <div class="th-sheet__actions">
      <button class="th-btn th-btn--secondary">Отмена</button>
      <button class="th-btn th-btn--danger">Продать</button>
    </div>
  </section>
</div>
