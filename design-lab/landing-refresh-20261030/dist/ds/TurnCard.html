<!doctype html><html lang="ru" data-mqx-style="ink"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TurnCard — Чернильный край</title><link rel="stylesheet" href="./tokens.css"><link rel="stylesheet" href="./bundle.css"><link rel="stylesheet" href="./runtime-ink.css"><link rel="stylesheet" href="./ink-examples.css"><style>body{background:transparent}.th-stage{max-width:none;padding:16px}html{overflow-x:hidden}</style></head><body class="th-ink"><!-- @dsCard group="Ход" height=300 -->
<div class="th-stage">
  <section class="th-turn" aria-label="Ход 7">
    <div class="th-turn__top">
      <img class="th-avatar" src="./assets/Characters/student-chibi.svg" alt="">
      <div class="th-turn__who"><span class="th-cap">Студент</span><b>Твой ход</b></div>
      <span class="th-cell th-cell--now" aria-label="Ход 7">7</span>
    </div>
    <div  class="th-deck"><span class="th-deck__cards" aria-hidden="true"><i></i><i></i></span><span><b>2 события</b><small>Открой колоду до конца хода</small></span><span class="th-deck__go" aria-hidden="true">›</span></div>
    <div class="th-tip th-tip--inline"><img src="./assets/Monetka/monetka-ink-avatar.svg" alt=""><span>Зарплата ещё не забрана — она сгорит после хода.</span></div>
    <div  class="th-btn th-btn--primary th-btn--wide">Завершить ход</div>
  </section>
</div>
</body></html>
