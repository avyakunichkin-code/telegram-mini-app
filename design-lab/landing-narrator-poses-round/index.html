<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Лендинг · позы рассказчиков</title><style>body{margin:0;background:#f4f0fb;color:#23183d;font:16px/1.5 system-ui}header{padding:16px 24px}h1{font-size:24px;margin:8px 0}nav{display:flex;gap:12px;flex-wrap:wrap}a{color:#6422dc}iframe{display:block;border:0;width:100%;height:85vh;background:#f4f0fb}button{font:inherit;min-height:44px;padding:8px 16px;border:2px solid #23183d;border-radius:10px;background:white;cursor:pointer}button[aria-pressed=true]{background:#6422dc;color:white}</style></head><body><header><a href="../index.html">Design lab</a><h1>Лендинг · разные позы по смыслу блоков</h1><p>Студент слева → Профессионал справа → Руководитель слева → Предприниматель справа. Новые позы — в прежнем стиле B «Мягкий объём».</p><nav><button data-version="index" aria-pressed="true">B · Контекстные позы</button><button data-version="before" aria-pressed="false">A · Опубликовано</button><a href="./site/index.html#interface" target="_blank">Открыть новый вариант отдельно</a></nav></header><iframe title="Лендинг — сравнение" src="./site/index.html#interface"></iframe><script>document.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.querySelector('iframe').src='./site/'+b.dataset.version+'.html#interface';});</script></body></html>
