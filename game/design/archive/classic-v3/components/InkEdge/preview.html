<div class="th-stage th-ink">
  <section class="th-ink-main" aria-label="Ход 12">
    <div class="th-row"><b class="th-h">Твой ход</b><span class="th-cap">ход 12</span></div>
    <button class="th-btn th-btn--secondary th-btn--wide th-ink-fill">2 события — открой колоду</button>
    <button class="th-btn th-btn--primary th-btn--wide th-ink-fill">Завершить ход</button>
  </section>
  <div class="th-ink-seg" role="group" aria-label="Капитал">
    <button aria-pressed="true">Детали</button><button aria-pressed="false">Действия</button>
  </div>
  <div class="th-row">
    <button class="th-btn th-btn--secondary th-ink-press">В подушку</button>
    <button class="th-btn th-btn--secondary th-ink-press">Вложить</button>
  </div>
  <div class="th-ink-edge"><span class="th-cap">На счёте</span><br><b class="th-money">87 400 ₽</b></div>
  <div class="th-ink-locked">Облигации · Откроется на шаге 4</div>
  <section class="th-sheet" aria-label="Лист в стиле ink">
    <h3 class="th-sheet__title">Депозит</h3>
    <button class="th-sheet__close" aria-label="Закрыть">×</button>
    <p class="th-close__line" style="text-align:left">Лист — только чернильная линия сверху, крестик — заливка и тень.</p>
  </section>
</div>
