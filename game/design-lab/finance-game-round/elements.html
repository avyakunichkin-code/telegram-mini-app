<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Элементы · Финансы как игра</title>
<link rel="stylesheet" href="./styles.css">
<main class="content">
  <p><a href="./compact.html">← Главная</a></p>
  <h1>Элементы «Финансы как игра»</h1>
  <section class="panel">
    <h2>Иконки</h2>
    <p><span class="game-icon calendar" aria-hidden="true"></span> События</p>
    <p><span class="game-icon coins" aria-hidden="true"></span> Доходы и зарплата</p>
    <p><span class="game-icon withdraw" aria-hidden="true"></span> Снятие из подушки</p>
    <p><span class="game-icon shield" aria-hidden="true"></span> Подушка</p>
    <p><span class="game-icon invest" aria-hidden="true"></span> Вложения</p>
    <p><span class="goal-nav-icon target-icon" aria-hidden="true"></span> Цель сценария</p>
    <p><img class="need-glyph need-home" src="https://cdn.jsdelivr.net/npm/@phosphor-icons/core@2.1.1/assets/fill/house-line-fill.svg" alt="" width="20" height="20"> Комфорт</p>
    <p><img class="need-glyph need-rank" src="https://cdn.jsdelivr.net/npm/@phosphor-icons/core@2.1.1/assets/fill/medal-fill.svg" alt="" width="20" height="20"> Статус</p>
    <p><img class="need-glyph need-links" src="https://cdn.jsdelivr.net/npm/@phosphor-icons/core@2.1.1/assets/fill/handshake-fill.svg" alt="" width="20" height="20"> Связи</p>
    <p><img class="need-glyph need-health" src="https://cdn.jsdelivr.net/npm/@phosphor-icons/core@2.1.1/assets/fill/heart-fill.svg" alt="" width="20" height="20"> Здоровье</p>
  </section>
  <section class="panel">
    <h2>Кнопки</h2>
    <button class="primary" type="button">Завершить ход</button>
    <div class="actions">
      <button type="button"><span class="game-icon coins" aria-hidden="true"></span> Зарплата</button>
      <button type="button" disabled>Зарплата получена</button>
    </div>
  </section>
</main>
</html>
