name: Codex architecture check
on:
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - '**/AGENTS.md'
      - 'docs/game/**'
      - 'docs/plan/**'
      - 'CONVENTIONS.md'
      - '.agents/**'
      - '.codex/**'
      - 'scripts/codex/**'
      - 'scripts/check-product-docs.mjs'
      - 'docs/product-doc-relocations.json'
      - '.ignore'
      - '.obsidian/app.json'
      - 'frontend-react/scripts/build-design-lab-nav.mjs'
      - 'design-lab/index.html'
      - 'design-lab/nav.manifest.json'
      - 'docs/ai/**'
      - 'docs/events/**'
      - 'docs/templates/**'
      - 'backend/migrations/0000_schema_baseline.sql'
      - '.github/workflows/codex-check.yml'
  pull_request:
    paths:
      - 'AGENTS.md'
      - '**/AGENTS.md'
      - 'docs/game/**'
      - 'docs/plan/**'
      - 'CONVENTIONS.md'
      - '.agents/**'
      - '.codex/**'
      - 'scripts/codex/**'
      - 'scripts/check-product-docs.mjs'
      - 'docs/product-doc-relocations.json'
      - '.ignore'
      - '.obsidian/app.json'
      - 'frontend-react/scripts/build-design-lab-nav.mjs'
      - 'design-lab/index.html'
      - 'design-lab/nav.manifest.json'
      - 'docs/ai/**'
      - 'docs/events/**'
      - 'docs/templates/**'
      - 'backend/migrations/0000_schema_baseline.sql'
      - '.github/workflows/codex-check.yml'
permissions:
  contents: read
jobs:
  codex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/codex/check.mjs
      - run: node scripts/check-product-docs.mjs
      - run: node --test scripts/codex/*.test.mjs
