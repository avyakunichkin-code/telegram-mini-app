# Compatibility job for the former skills workflow; Codex sources only.
name: Codex skills check
on:
  pull_request:
    paths:
      - '**/*.md'
      - '.agents/**'
      - 'game/.agents/**'
      - 'plan/.agents/**'
      - 'shared/.agents/**'
      - '.codex/**'
      - 'game/.codex/**'
      - 'plan/.codex/**'
      - 'shared/.codex/**'
      - 'scripts/codex/**'
      - 'docs/agents/**'
      - 'docs/templates/**'
      - 'docs/engineering/**'
      - 'game/docs/engineering/**'
      - '.github/workflows/skills-check.yml'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '.agents/**'
      - 'game/.agents/**'
      - 'plan/.agents/**'
      - 'shared/.agents/**'
      - '.codex/**'
      - 'game/.codex/**'
      - 'plan/.codex/**'
      - 'shared/.codex/**'
      - 'scripts/codex/**'
      - 'docs/agents/**'
      - 'docs/templates/**'
      - 'docs/engineering/**'
      - 'game/docs/engineering/**'
      - '.github/workflows/skills-check.yml'
permissions:
  contents: read
concurrency:
  group: skills-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/codex/check.mjs
      - run: node --test scripts/codex/*.test.mjs
