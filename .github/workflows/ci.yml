# PR-04: required CI. Backend pytest (вместе с shared/packages/fincore и shared/packages/platform) + frontend unit/guardrails/build.
# Вызывается и из deploy-app.yml (workflow_call): Pages публикуется только после зелёных проверок.
# Required checks в Settings → Branches → main: «Backend pytest», «Frontend unit + guardrails», «Game balance diff» (с 2026-11-02).
#
# SPL-405: фильтры по путям. На PR каждый job идёт только если тронута его зона; общий код
# (shared/packages/, .github/) гоняет ВСЁ — тесты игры, balance diff игры и тесты Plan. Job, пропущенный
# по `if`, GitHub засчитывает required-проверке как успешный. Вне PR (workflow_call из деплоя) — всё.
name: CI

on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    outputs:
      game: ${{ steps.areas.outputs.game }}
      plan: ${{ steps.areas.outputs.plan }}
      shared_ui: ${{ steps.areas.outputs.shared_ui }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # game / plan = true, если тронута зона приложения или общий код. Не PR — всегда true.
      - id: areas
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "game=true" >> "$GITHUB_OUTPUT"; echo "plan=true" >> "$GITHUB_OUTPUT"; echo "shared_ui=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE"...HEAD)
          echo "$files"
          # Codex instructions/adapters are covered by AI workflows, not product suites.
          files=$(printf '%s\n' "$files" | grep -Ev '(^|/)\.(agents|codex)/|(^|/)AGENTS(\.override)?\.md$|(^|/)docs/engineering/|^scripts/codex/' || true)
          shared='^(shared/|scripts/|\.github/)'
          game='^game/'
          plan='^plan/'
          has() { echo "$files" | grep -Eq "$1" && echo true || echo false; }
          s=$(has "$shared")
          [ "$s" = true ] && g=true || g=$(has "$game")
          [ "$s" = true ] && p=true || p=$(has "$plan")
          echo "game=$g" >> "$GITHUB_OUTPUT"
          echo "plan=$p" >> "$GITHUB_OUTPUT"
          echo "shared_ui=$(has '^(game/web/|plan/web/|shared/packages/|shared/tests/ui/|\.github/)')" >> "$GITHUB_OUTPUT"

  # Общий ButtonBase: настоящие адаптеры Plan и Game. Правка игры не должна ломать Plan незаметно.
  shared-ui:
    name: Shared UI contract
    needs: changes
    if: needs.changes.outputs.shared_ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: shared/tests/ui/package-lock.json
      - name: Install contract runtime
        working-directory: shared/tests/ui
        run: npm ci
      - name: Check both adapters
        run: node --test shared/tests/ui/*.test.mjs

  backend:
    name: Backend pytest
    needs: changes
    if: needs.changes.outputs.game == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Версии в requirements.txt закреплены на Python 3.14.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            game/api/requirements.txt
            game/api/requirements-dev.txt
            shared/packages/fincore/pyproject.toml

      - name: Install dependencies
        working-directory: game/api
        run: pip install -r requirements-dev.txt

      # Тесты на SQLite, PostgreSQL не нужен. testpaths включает shared/packages/fincore/tests и shared/packages/platform/tests.
      - name: Pytest
        working-directory: game/api
        run: python -m pytest -q

  # SQL-миграции на настоящем PostgreSQL (docs/plans/PLAN_ci-postgres-parity.md, срез 1).
  # Backend pytest идёт на SQLite и строит схему из моделей, поэтому миграции нигде не выполнялись.
  # Не required: сначала понаблюдать за стабильностью (срез 4).
  migrations-pg:
    name: Postgres migrations
    needs: changes
    if: needs.changes.outputs.game == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: tvoyhod_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d tvoyhod_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/tvoyhod_ci
    steps:
      - uses: actions/checkout@v4

      # baseline на пустую БД + все инкременты 00NN_* (ON_ERROR_STOP=1: любая ошибка SQL валит job)
      - name: Migrate from empty database
        run: bash game/api/scripts/db.sh migrate

      # baseline пропускается (схема есть), инкременты обязаны быть идемпотентными (IF NOT EXISTS)
      - name: Migrate again (idempotency)
        run: bash game/api/scripts/db.sh migrate

      # Срез 2: схема после миграций против моделей (game/api/tests/test_pg_schema_drift.py)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            game/api/requirements.txt
            game/api/requirements-dev.txt
            shared/packages/fincore/pyproject.toml

      - name: Install dependencies
        working-directory: game/api
        run: pip install -r requirements-dev.txt

      # Срез 2 + 3: дрейф схемы и критичные тесты (game/api/tests/conftest.py::PG_CRITICAL) на PostgreSQL
      - name: Postgres tests (schema drift + critical)
        working-directory: game/api
        env:
          TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/tvoyhod_ci
        run: python -m pytest -m pg -q -rs

  # Balance diff игры к эталонам game/docs/balance/baselines: ядро (fincore/platform) меняется только с diff = 0.
  # Инварианты победимости — warn: их провал известен до SPL-405 (INV-1, DOC_SYNC_LOG 2026-10-25),
  # здесь ловим дрейф чисел, а не калибровку экономики.
  balance:
    name: Game balance diff
    needs: changes
    if: needs.changes.outputs.game == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            game/api/requirements.txt
            game/api/requirements-dev.txt
            shared/packages/fincore/pyproject.toml

      # requirements-dev: balance_simulate гоняет ход через TestClient (нужен httpx)
      - name: Install dependencies
        working-directory: game/api
        run: pip install -r requirements-dev.txt

      - name: Balance playtest
        working-directory: game/api
        run: python scripts/balance_playtest.py --invariants warn

  frontend:
    name: Frontend unit + guardrails
    needs: changes
    if: needs.changes.outputs.game == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: game/web/package-lock.json

      - name: Install
        working-directory: game/web
        run: npm ci

      - name: Unit tests
        working-directory: game/web
        run: npm run test:unit

      - name: Guardrails
        working-directory: game/web
        run: npm run check:guardrails

      - name: Build
        working-directory: game/web
        run: npm run build

  # UI-сценарии игрока (Playwright, системный Chrome раннера). Не required: сначала понаблюдать
  # за стабильностью. Повод: 2026-11-01 на main 4 из 7 сценариев падали незамеченными (PR-12).
  e2e:
    name: E2E (Playwright)
    needs: changes
    if: needs.changes.outputs.game == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            game/api/requirements.txt
            shared/packages/fincore/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: game/web/package-lock.json

      - name: Backend dependencies
        working-directory: game/api
        run: pip install -r requirements.txt

      - name: Frontend dependencies
        working-directory: game/web
        run: npm ci

      # Стенд поднимает playwright.config.js: uvicorn на SQLite :8011 + Vite :5181.
      - name: Playwright
        working-directory: game/web
        env:
          E2E_PYTHON: python
        run: npm run test:e2e

      - name: Report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            game/web/playwright-report
            game/web/test-results
          retention-days: 7

  # Plan (ADR-016, ADR-017): plan-api на БД (SQLite в тестах) + platform, plan-web build и e2e.
  # Required check for main; game-only PRs skip it through the path filter.
  plan:
    name: Plan API + web
    needs: changes
    if: needs.changes.outputs.plan == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            plan/api/requirements.txt
            shared/packages/fincore/pyproject.toml
            shared/packages/platform/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plan/web/package-lock.json

      - name: Platform + api-client tests
        run: |
          pip install -e shared/packages/platform pytest httpx
          (cd shared/packages/platform && python -m pytest -q)
          node --test shared/packages/api-client/test/*.test.js

      - name: Plan API pytest
        working-directory: plan/api
        run: |
          pip install -r requirements.txt
          python -m pytest -q

      - name: Plan web unit + build
        working-directory: plan/web
        run: |
          npm ci
          npm run test:unit
          npm run build

      - name: Plan web e2e
        working-directory: plan/web
        env:
          E2E_PYTHON: python
        run: npm run test:e2e

      - name: Report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: plan-playwright-report
          path: |
            plan/web/playwright-report
            plan/web/test-results
          retention-days: 7

  # Общие статические проверки не требуют установки приложений.
  extras:
    name: Repository conventions + navigation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Conventions
        run: python scripts/check_conventions.py

      - name: Product roots and navigation
        run: node scripts/check-product-roots.mjs

  plan-landing:
    name: Plan landing
    needs: changes
    if: needs.changes.outputs.plan == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Plan landing build
        working-directory: plan/landing
        run: npm run build

  game-landing:
    name: Game landing
    needs: changes
    if: needs.changes.outputs.game == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: game/landing/package-lock.json
      - name: Landing build
        working-directory: game/landing
        run: |
          npm ci
          npm run build
