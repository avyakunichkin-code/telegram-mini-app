# PR-04: required CI. Backend pytest (вместе с packages/fincore и packages/platform) + frontend unit/guardrails/build.
# Вызывается и из deploy-app.yml (workflow_call): Pages публикуется только после зелёных проверок.
# Required checks в Settings → Branches → main: «Backend pytest», «Frontend unit + guardrails».
#
# SPL-405: фильтры по путям. На PR каждый job идёт только если тронута его зона; общий код
# (packages/, .github/) гоняет ВСЁ — тесты игры, balance diff игры и тесты Plan. Job, пропущенный
# по `if`, GitHub засчитывает required-проверке как успешный. Вне PR (workflow_call из деплоя) — всё.
name: CI

on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    outputs:
      game: ${{ steps.areas.outputs.game }}
      plan: ${{ steps.areas.outputs.plan }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # game / plan = true, если тронута зона приложения или общий код. Не PR — всегда true.
      - id: areas
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "game=true" >> "$GITHUB_OUTPUT"; echo "plan=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE"...HEAD)
          echo "$files"
          shared='^(packages/|\.github/)'
          game='^(backend/|frontend-react/|data/|scripts/|docs/balance/baselines/)'
          plan='^apps/plan-'
          has() { echo "$files" | grep -Eq "$1" && echo true || echo false; }
          s=$(has "$shared")
          [ "$s" = true ] && g=true || g=$(has "$game")
          [ "$s" = true ] && p=true || p=$(has "$plan")
          echo "game=$g" >> "$GITHUB_OUTPUT"
          echo "plan=$p" >> "$GITHUB_OUTPUT"

  backend:
    name: Backend pytest
    needs: changes
    if: needs.changes.outputs.game == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Версии в requirements.txt закреплены на Python 3.14.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            packages/fincore/pyproject.toml

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      # Тесты на SQLite, PostgreSQL не нужен. testpaths включает packages/fincore/tests и packages/platform/tests.
      - name: Pytest
        working-directory: backend
        run: python -m pytest -q

  # Balance diff игры к эталонам docs/balance/baselines: ядро (fincore/platform) меняется только с diff = 0.
  # Инварианты победимости — warn: их провал известен до SPL-405 (INV-1, DOC_SYNC_LOG 2026-10-25),
  # здесь ловим дрейф чисел, а не калибровку экономики.
  balance:
    name: Game balance diff
    needs: changes
    if: needs.changes.outputs.game == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            packages/fincore/pyproject.toml

      # requirements-dev: balance_simulate гоняет ход через TestClient (нужен httpx)
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Balance playtest
        working-directory: backend
        run: python scripts/balance_playtest.py --invariants warn

  frontend:
    name: Frontend unit + guardrails
    needs: changes
    if: needs.changes.outputs.game == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install
        working-directory: frontend-react
        run: npm ci

      - name: Unit tests
        working-directory: frontend-react
        run: npm run test:unit

      - name: Guardrails
        working-directory: frontend-react
        run: npm run check:guardrails

      - name: Build
        working-directory: frontend-react
        run: npm run build

  # UI-сценарии игрока (Playwright, системный Chrome раннера). Не required: сначала понаблюдать
  # за стабильностью. Повод: 2026-11-01 на main 4 из 7 сценариев падали незамеченными (PR-12).
  e2e:
    name: E2E (Playwright)
    needs: changes
    if: needs.changes.outputs.game == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            packages/fincore/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Frontend dependencies
        working-directory: frontend-react
        run: npm ci

      # Стенд поднимает playwright.config.js: uvicorn на SQLite :8011 + Vite :5181.
      - name: Playwright
        working-directory: frontend-react
        env:
          E2E_PYTHON: python
        run: npm run test:e2e

      - name: Report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend-react/playwright-report
            frontend-react/test-results
          retention-days: 7

  # Plan (ADR-016, ADR-017): plan-api на БД (SQLite в тестах) + platform, plan-web build и e2e.
  # Не входит в required checks игры.
  plan:
    name: Plan API + web
    needs: changes
    if: needs.changes.outputs.plan == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            apps/plan-api/requirements.txt
            packages/fincore/pyproject.toml
            packages/platform/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/plan-web/package-lock.json

      - name: Platform + api-client tests
        run: |
          pip install -e packages/platform pytest httpx
          (cd packages/platform && python -m pytest -q)
          node --test packages/api-client/test/*.test.js

      - name: Plan API pytest
        working-directory: apps/plan-api
        run: |
          pip install -r requirements.txt
          python -m pytest -q

      - name: Plan web build
        working-directory: apps/plan-web
        run: |
          npm ci
          npm run build

      - name: Plan web e2e
        working-directory: apps/plan-web
        env:
          E2E_PYTHON: python
        run: npm run test:e2e

      - name: Report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: plan-playwright-report
          path: |
            apps/plan-web/playwright-report
            apps/plan-web/test-results
          retention-days: 7

  # Лендинг и свод принципов — всегда, быстрые.
  extras:
    name: Landing + conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: Conventions
        run: python scripts/check_conventions.py

      - name: Landing build
        working-directory: landing
        run: |
          npm ci
          npm run build
