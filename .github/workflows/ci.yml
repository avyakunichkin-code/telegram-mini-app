# PR-04: required CI. Backend pytest (вместе с packages/fincore) + frontend unit/guardrails/build.
# Вызывается и из deploy-app.yml (workflow_call): Pages публикуется только после зелёных проверок.
# Required checks в Settings → Branches → main: «Backend pytest», «Frontend unit + guardrails».
name: CI

on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Версии в requirements.txt закреплены на Python 3.14.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            packages/fincore/pyproject.toml

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      # Тесты на SQLite, PostgreSQL не нужен. testpaths включает packages/fincore/tests.
      - name: Pytest
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Frontend unit + guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install
        working-directory: frontend-react
        run: npm ci

      - name: Unit tests
        working-directory: frontend-react
        run: npm run test:unit

      - name: Guardrails
        working-directory: frontend-react
        run: npm run check:guardrails

      - name: Build
        working-directory: frontend-react
        run: npm run build

  # Прототип Plan (ADR-016), лендинг и свод принципов: не входят в required checks игры.
  extras:
    name: Plan prototype + landing + conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            apps/plan-api/requirements.txt
            packages/fincore/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/plan-web/package-lock.json
            landing/package-lock.json

      - name: Conventions
        run: python scripts/check_conventions.py

      - name: Plan API pytest
        working-directory: apps/plan-api
        run: |
          pip install -r requirements.txt
          python -m pytest -q

      - name: Plan web build
        working-directory: apps/plan-web
        run: |
          npm ci
          npm run build

      - name: Landing build
        working-directory: landing
        run: |
          npm ci
          npm run build
