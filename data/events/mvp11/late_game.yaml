events:
- definition_key: mq11_portfolio_rebalance
  content_class: universal
  event_slot: period_choice
  audience_template_keys:
  - all
  event_domain: investment_education
  title: Пересмотр портфеля
  description: Накопилось на счёте — банк предлагает перераспределить между депозитом и облигациями.
  weight: 64
  event_tier: 4
  repeat_policy: repeatable
  cooldown_periods: 10
