      cash_delta: -2500
      needs_delta:
        status: 7
        comfort: 3
        health: -2
  - title: Оставить как есть
    effects:
      cash_delta: 0
      needs_delta:
        status: -3
        comfort: -1
  - title: Усилить депозит
    effects:
      cash_delta: -1200
      needs_delta:
        comfort: 5
        status: 2
        health: 1
- definition_key: mq11_rent_room_student
