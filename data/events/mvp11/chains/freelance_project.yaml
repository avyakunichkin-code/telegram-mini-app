# Эталонная цепочка «Заказ от Миши» — студент, 4 шага, периоды N / N+2 / N+4 / N+5.
# Контракт 22 000 ₽; аванс 8 000; остаток 14 000 после защиты; бонус качества 35% (7 700 ₽).
# Аванс — риск: при сдаче в спешке Миша удерживает 4 000 ₽ из остатка (итог 18 000 против 22 000 без аванса).
# Цена «времени» 0.5 (разбор 2026-10-21): путь «шашлыки» даёт ≈ +9 needs к пути «работа»,
# что ≈ 0.5 · needs_points(бонус 7 700 ₽ / зарплата Студента).
events:
- definition_key: mq11_freelance_project_offer
  content_class: profile
  event_slot: period_choice
  audience_template_keys:
  - mq_game_basic_v1
  event_domain: income_work
  title: Миша просит помочь с проектом
  description: 'Одногруппник Миша тянет стартап к защите: нужны тексты и вёрстка лендинга. Гонорар
    — 22 000 ₽ после защиты (через несколько периодов). Можно попросить аванс 8 000 сейчас — но аванс
    обязывает: если работа выйдет сырой, Миша вычтет из остатка.'
  weight: 72
  event_tier: 2
  repeat_policy: once_per_profile
  scenario_shape: chain
  cooldown_periods: 12
  choices:
  - title: Взять заказ с авансом 8 000 ₽
    effects:
      cash_delta: 8000
      needs_delta:
        status: 3
        health: -2
      enqueue_event:
        chain_key: freelance_project
        followup_definition_key: mq11_freelance_project_midperiod
        after_periods: 2
        context:
          payment: advance
          branch: advance
    description: Аванс на счёт сейчас. Остаток 14 000 ₽ — после защиты; за сырую работу Миша удержит
      часть остатка.
  - title: Без аванса — вся оплата после защиты
    effects:
      cash_delta: 0
      needs_delta:
        status: 3
        health: -2
      enqueue_event:
        chain_key: freelance_project
        followup_definition_key: mq11_freelance_project_midperiod
        after_periods: 2
        context:
          payment: deferred
          branch: deferred
    description: Денег сейчас нет — 22 000 ₽ целиком после защиты при любом качестве работы.
  - title: Отказаться — сессия важнее
    effects:
      cash_delta: 0
      needs_delta:
        comfort: 1
        social: -4
        status: -2
