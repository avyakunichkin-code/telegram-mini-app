[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tvoy-hod-platform"
version = "0.1.0"
description = "Инфраструктура Game и Plan (ADR-016 п.2): JWT с iss/aud, подключение к БД, SQL-миграции, health. Без доменов"
requires-python = ">=3.11"
dependencies = ["pyjwt>=2.8", "sqlalchemy>=2.0", "fastapi>=0.110"]

[tool.setuptools.packages.find]
where = ["src"]
