[pytest]
testpaths = tests ../packages/fincore/tests ../packages/platform/tests
pythonpath = . ../packages/platform/src
python_files = test_*.py
python_functions = test_*
markers =
    unit: чистая логика без HTTP (tests/unit)
    integration: TestClient + DB (tests/integration)
    contract: контракт данных FE↔BE или каталог
    acceptance: сквозные сценарии игрока
    pg: нужен PostgreSQL с применёнными миграциями (TEST_DATABASE_URL), иначе пропускается
    slow: длительные симуляции (balance playtest)
