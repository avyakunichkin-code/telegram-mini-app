# SPL-102, режим отчёта: кандидаты в fincore, которые ещё зависят от ORM/HTTP.
# Не гейт — список нарушений = backlog фазы 2 PLAN_game-plan-split.
# Запуск из backend/: python -c "from importlinter.cli import lint_imports; lint_imports(config_filename='importlinter-report.ini')"
[importlinter]
root_packages =
    app
include_external_packages = True

[importlinter:contract:fincore-candidates]
name = Кандидаты в fincore не импортируют ORM и HTTP напрямую
type = forbidden
# annuity, helpers, invest_products, liability_kinds — уже шимы/адаптеры над fincore (SPL-202);
# starter_liability — игровой разбор blueprint, расчёт платежа в fincore (SPL-203);
# period_metrics — чтение закрытий из БД, формула в fincore.metrics (SPL-207).
source_modules =
    app.finance.expenses
    app.finance.period_close_preview
    app.finance.balance_utils
forbidden_modules =
    sqlalchemy
    fastapi
    app.models
    app.database
allow_indirect_imports = True
